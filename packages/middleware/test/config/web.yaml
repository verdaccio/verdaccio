web:
  title: verdaccio web
  login: true
  scope: '@scope'
  pkgManagers:
    - pnpm
    - yarn
  showInfo: true
  showSettings: true
  showSearch: true
  showFooter: true
  footer: 'Internal registry · [Support](https://verdaccio.org/docs/what-is-verdaccio)'
  poweredBy: false
  help: |
    ## Platform registry
    Run `npm config set registry {{registryUrl}}` first.
  showPackageListToolbar: true
  showThemeSwitch: true
  showDownloadTarball: true
  showRaw: true
  primary_color: '#ffffff'
  logo: 'http://fake.verdaccio.org/logo.png'
  html_cache: false

url_prefix: /prefix

log: { type: stdout, format: pretty, level: trace }

flags:
  changePassword: true
