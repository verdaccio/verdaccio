auth:
  auth-memory:
    users:
      test:
        name: test
        password: test

web:
  title: verdaccio

uplinks:
  a:
    url: https://registry.npmjs.org/
    headers:
      x-uplink: a
  b:
    url: https://registry.npmjs.org/
    headers:
      x-uplink: b

log: { type: stdout, format: pretty, level: trace }

packages:
  'local-*':
    access: $anonymous
    publish: $anonymous
  'dup-*':
    access: $anonymous
    publish: $anonymous
    proxy: a b
  '@restricted/*':
    access: $authenticated
    publish: $anonymous
    proxy: a
  '@*/*':
    access: $anonymous
    publish: $anonymous
    proxy: a
  '**':
    access: $anonymous
    publish: $anonymous
    proxy: a
_debug: true
