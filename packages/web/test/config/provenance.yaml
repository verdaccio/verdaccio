auth:
  auth-memory:
    users:
      test:
        name: test
        password: test

web:
  title: verdaccio

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

log: { type: stdout, format: pretty, level: trace }

packages:
  'local-*':
    access: $anonymous
    publish: $anonymous
  '@*/*':
    access: $anonymous
    publish: $anonymous
    proxy: npmjs
  '**':
    access: $anonymous
    publish: $anonymous
    proxy: npmjs
_debug: true
