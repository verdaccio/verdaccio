auth:
  auth-memory:
    users:
      test:
        name: test
        password: test

web:
  title: verdaccio
  login: false

publish:
  allow_offline: false

uplinks:

log: { type: stdout, format: pretty, level: trace }

packages:
  '@restricted/*':
    access: $authenticated
    # to facilitate the test we allow anonymous publish
    publish: $anonymous
  '@*/*':
    access: $anonymous
    publish: $anonymous
  '**':
    access: $anonymous
    publish: $anonymous
_debug: true
