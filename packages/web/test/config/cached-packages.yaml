auth:
  auth-memory:
    users:
      test:
        name: test
        password: test

web:
  title: verdaccio

publish:
  allow_offline: false

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

log: { type: stdout, format: pretty, level: warn }

packages:
  'secret-*':
    access: $authenticated
    publish: $anonymous
    proxy: npmjs
  '@*/*':
    access: $anonymous
    publish: $anonymous
    proxy: npmjs
  '**':
    access: $anonymous
    publish: $anonymous
    proxy: npmjs
_debug: true

flags:
  cachedPackages: true
