auth:
  htpasswd:
    file: ./htpasswd-stage-notify
web:
  enable: true
  title: verdaccio

publish:
  allow_offline: false

uplinks:

log: { type: stdout, format: pretty, level: fatal }

notify:
  method: POST
  headers: { 'Content-Type': 'application/json' }
  endpoint: http://slack-service/foo?auth_token=mySecretToken
  content: '{"publishedPackage":"{{ publishedPackage }}","publishType":"{{ publishType }}"}'

flags:
  stage: true

packages:
  'restricted-*':
    access: $all
    publish: owner
    unpublish: owner
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
_debug: true
