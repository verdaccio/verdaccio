defaultSemverRangePrefix: ""

enableGlobalCache: false

enableHardenedMode: false

enableScripts: false

nodeLinker: node-modules

npmAuditIgnoreAdvisories:
  # brace-expansion <=5.0.7 DoS (GHSA-mh99-v99m-4gvg) via minimatch inside the
  # @verdaccio/* packages. The fixed 5.0.8 (published 2026-07-23) is still inside
  # the npmMinimalAgeGate quarantine; drop this ignore and pin the fix once it
  # ages out (~2026-08-07).
  - "1124334"

npmMinimalAgeGate: 15d

npmPreapprovedPackages:
  - "@verdaccio/*"
  - verdaccio-*
  - js-yaml@5.2.2

npmRegistryServer: "https://registry.npmjs.org"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
