defaultSemverRangePrefix: ""

enableGlobalCache: false

enableHardenedMode: false

enableScripts: false

nodeLinker: node-modules

npmAuditIgnoreAdvisories:
  # fast-uri (via Ajv)
  - "1239943" # GHSA-qw65-cvwx-89v3
  - "1239946" # GHSA-58mr-gqgx-xq4g

npmMinimalAgeGate: 15d

npmPreapprovedPackages:
  - "@verdaccio/*"
  - verdaccio-*
  - js-yaml@5.2.2
  # security fix: resolves qs 6.16.0 (GHSA-4mjr-xmp4-gh2g and related DoS advisories);
  # also pinned by @verdaccio/middleware 8.1.4 and verdaccio-audit 13.1.4
  - express@4.22.3

npmRegistryServer: "https://registry.npmjs.org"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
