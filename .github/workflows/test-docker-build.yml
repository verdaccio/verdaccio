name: Test Docker Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  MIN_RELEASE_AGE: 3

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-docker-build-test-7x
  cancel-in-progress: true

jobs:
  testDocker:
    name: Test Docker Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build -t verdaccio-test .
        env:
          VERDACCIO_BUILD_REGISTRY: https://registry.npmjs.org

      - name: Run Verdaccio in background
        run: |
          docker run -d --name verdaccio-test -e "DEBUG=verdaccio*" -p 4873:4873 \
            --health-cmd 'wget --quiet --tries=1 --spider http://127.0.0.1:4873/-/ping || exit 1' \
            --health-interval 5s --health-timeout 5s --health-start-period 10s --health-retries 3 \
            verdaccio-test
          for i in $(seq 1 30); do
            curl --fail --silent http://localhost:4873/-/ping && exit 0
            sleep 1
          done
          exit 1

      - name: Verify the documented health check reports healthy
        run: |
          for i in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' verdaccio-test)
            [ "$health" = "healthy" ] && exit 0
            [ "$health" = "unhealthy" ] && break
            sleep 1
          done
          docker inspect --format '{{json .State.Health}}' verdaccio-test
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install latest npm
        run: npm install --global npm@latest --ignore-scripts --no-audit --no-fund

      - name: Test npm install from local Verdaccio
        run: |
          npm install --global verdaccio@next-7 --registry http://localhost:4873 \
            --ignore-scripts --no-audit --no-fund \
            --min-release-age "$MIN_RELEASE_AGE" \
            --min-release-age-exclude verdaccio \
            --min-release-age-exclude '@verdaccio/*' \
            --min-release-age-exclude 'verdaccio-*'

      - name: Show Verdaccio logs (for debugging)
        if: always()
        run: docker logs verdaccio-test || true

      - name: Stop Verdaccio
        if: always()
        run: docker rm --force verdaccio-test || true

  testStorageVolume:
    name: Test Storage Volume
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build -t verdaccio-test .
        env:
          VERDACCIO_BUILD_REGISTRY: https://registry.npmjs.org

      - name: Prepare storage directory
        run: |
          mkdir -p storage
          sudo chown -R 10001:root storage

      - name: Run Verdaccio with storage volume
        run: |
          docker run -d --name verdaccio-test -e "DEBUG=verdaccio*" -p 4873:4873 \
            -v $PWD/storage:/verdaccio/storage \
            verdaccio-test
          for i in $(seq 1 30); do
            curl --fail --silent http://localhost:4873/-/ping && exit 0
            sleep 1
          done
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install latest npm
        run: npm install --global npm@latest --ignore-scripts --no-audit --no-fund

      - name: Test npm install from local Verdaccio
        run: |
          npm install --global verdaccio@next-7 --registry http://localhost:4873 \
            --ignore-scripts --no-audit --no-fund \
            --min-release-age "$MIN_RELEASE_AGE" \
            --min-release-age-exclude verdaccio \
            --min-release-age-exclude '@verdaccio/*' \
            --min-release-age-exclude 'verdaccio-*'

      - name: Show Verdaccio logs (for debugging)
        if: always()
        run: docker logs verdaccio-test || true

      - name: Stop Verdaccio
        if: always()
        run: docker rm --force verdaccio-test || true

  testConfigVolume:
    name: Test Config Volume
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Docker image
        run: docker build -t verdaccio-test .
        env:
          VERDACCIO_BUILD_REGISTRY: https://registry.npmjs.org

      - name: Create config.yaml without comments
        run: |
          cat > config.yaml <<'EOF'
          storage: /verdaccio/storage/data
          plugins: /verdaccio/plugins
          web:
            title: Verdaccio
          auth:
            htpasswd:
              file: /verdaccio/storage/htpasswd
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
            yarn:
              url: https://registry.yarnpkg.com/
          packages:
            '@*/*':
              access: $all
              publish: $authenticated
              unpublish: $authenticated
              proxy: npmjs
            '**':
              access: $all
              publish: $authenticated
              unpublish: $authenticated
              proxy: yarn
          server:
            keepAliveTimeout: 60
          middlewares:
            audit:
              enabled: true
          log:
            type: stdout
            format: pretty
            level: http
          i18n:
            web: en-US
          EOF
      - name: Set permissions for config.yaml
        run: |
          sudo chown 10001:root config.yaml
          sudo chmod 644 config.yaml

      - name: Run Verdaccio with config volume
        run: |
          docker run -d --name verdaccio-test -e "DEBUG=verdaccio*" -p 4873:4873 \
            -v $PWD/config.yaml:/verdaccio/conf/config.yaml \
            verdaccio-test
          for i in $(seq 1 30); do
            curl --fail --silent http://localhost:4873/-/ping && exit 0
            sleep 1
          done
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install latest npm
        run: npm install --global npm@latest --ignore-scripts --no-audit --no-fund

      - name: Test npm install from local Verdaccio
        run: |
          npm install --global verdaccio@next-7 --registry http://localhost:4873 \
            --ignore-scripts --no-audit --no-fund \
            --min-release-age "$MIN_RELEASE_AGE" \
            --min-release-age-exclude verdaccio \
            --min-release-age-exclude '@verdaccio/*' \
            --min-release-age-exclude 'verdaccio-*'

      - name: Show Verdaccio logs (for debugging)
        if: always()
        run: docker logs verdaccio-test || true

      - name: Stop Verdaccio
        if: always()
        run: docker rm --force verdaccio-test || true
