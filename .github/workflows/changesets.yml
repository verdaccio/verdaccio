name: Changesets

on:
  workflow_dispatch:
  push:
    branches:
      - 7.x

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  # Open/refresh the "chore: release 7.x" version PR from changesets.
  # Runs freely (no env gate, no publish).
  version:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/7.x' && github.repository == 'verdaccio/verdaccio'
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - name: Build
        run: pnpm build
      - name: create versions
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Pass the release PAT explicitly so version PRs trigger CI.
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          version-script: pnpm ci:version
          commit-message: 'chore: release 7.x'
          pr-title: 'chore: release 7.x'

  # Publish to npm + Docker once the version PR is merged (no changesets left).
  # Gated by the `npm` environment, which requires manual approval.
  publish:
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - name: Build
        run: pnpm build
      - name: publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          publish-script: pnpm ci:publish
          create-github-releases: true
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Read published verdaccio version
        if: steps.changesets.outputs.published == 'true'
        id: ver
        run: |
          version=$(node -p "require('./package.json').version")
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          {
            echo "version=$version"
            echo "major=$major"
            echo "majorminor=${major}.${minor}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.ver.outputs.version
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        if: steps.ver.outputs.version
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.ver.outputs.version
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Docker metadata
        if: steps.ver.outputs.version
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: verdaccio/verdaccio
          # 7.x is the "next-7" line — NOT latest, so no latest tag here.
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=7.x-next

      - name: Build & push Docker image
        if: steps.ver.outputs.version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          commitMode: github-api
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
