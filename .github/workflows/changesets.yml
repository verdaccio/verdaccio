name: Changesets

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  # Open/refresh the version PR from changesets. Runs freely (no env gate, no publish).
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'verdaccio/verdaccio'
    outputs:
      # v2 renamed the output hasChangesets -> has-changesets
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies with a custom registry
        uses: ./.github/actions/install-app
      - name: crowdin download
        env:
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: pnpm crowdin:download
      - name: build
        run: pnpm build
      - name: create versions
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          # v2 renamed every input (version -> version-script, commit ->
          # commit-message, title -> pr-title) and dropped setupGitUser. It
          # also no longer reads the GITHUB_TOKEN env var: the custom PAT
          # (needed so the version PR triggers CI) must go through the
          # github-token input.
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          version-script: pnpm ci:version
          commit-message: 'chore: update versions'
          pr-title: 'chore: update versions'

  # Publish to npm once the version PR is merged (no changesets left).
  # Gated by the `npm` environment, which requires manual approval.
  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    timeout-minutes: 14
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies with a custom registry
        uses: ./.github/actions/install-app
      - name: crowdin download
        env:
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: pnpm crowdin:download
      - name: build
        run: pnpm build
      - name: publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          publish-script: pnpm ci:publish
          # v2 defaults this to true; this repo cuts GitHub releases elsewhere
          create-github-releases: false
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
