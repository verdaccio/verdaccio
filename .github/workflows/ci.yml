name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - .changeset/**
      - .github/workflows/ci.yml
      - 'packages/**'
      - 'tests/**'
      - 'docker-examples/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'vite.lib.config.mjs'
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.head_ref != 'changeset-release/master' &&
      !contains(github.event.pull_request.labels.*.name, 'skip changeset')
    runs-on: ubuntu-latest
    name: Changeset file check
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changeset
        uses: ./.github/actions/changeset-check        
  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint & Format
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
        with:
          reporter: 'default'
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
  build:
    if: ${{ github.event.pull_request.draft == false }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node_version: [24, 26]
    name: Build / ${{ matrix.os }} / Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
        with:
          node-version: ${{ matrix.node_version }}
      - name: Build
        run: pnpm build
      - uses: ./.github/actions/build-cache
        with:
          mode: save
          node-version: ${{ matrix.node_version }}
  test-docker:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    uses: ./.github/workflows/test-docker.yml
  test:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node_version: [24, 26]
        suite: [ui, core]
        # ui-components alone takes as long as every other package together
        include:
          - suite: ui
            filter: --filter @verdaccio/ui-components
          - suite: core
            filter: --filter "./packages/**" --filter "!@verdaccio/ui-components" --no-sort
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node_version }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
        with:
          node-version: ${{ matrix.node_version }}
      - uses: ./.github/actions/build-cache
        with:
          mode: restore
          node-version: ${{ matrix.node_version }}
      - name: Test
        run: pnpm ${{ matrix.filter }} test
        env:
          NODE_OPTIONS: ${{ matrix.node_version == 26 && '--no-webstorage' || '' }}
  e2e-cli:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: E2E CLI (${{ matrix.pm }})
    strategy:
      fail-fast: false
      matrix:
        pm:
          - npm@10
          - npm@11
          - npm@12
          - yarn-modern@3
          - yarn-modern@4
          - pnpm@10
          - pnpm@11
          - bun
          - deno
          # installed by the e2e CLI itself; both only exercise install and ci
          - upm@1.3.1
          - nub@0.9.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
      - uses: ./.github/actions/build-cache
        with:
          mode: restore
          node-version: 24
      - uses: ./.github/actions/start-verdaccio
      - uses: ./.github/actions/e2e-cli
        with:
          pm: ${{ matrix.pm }}
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"
  e2e-ui:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: E2E UI (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
      - uses: ./.github/actions/build-cache
        with:
          mode: restore
          node-version: 24
      - uses: ./.github/actions/cypress-binary
      - uses: ./.github/actions/start-verdaccio
        with:
          config: ./scripts/e2e-ui-config.yaml
          test-user: 'true'
      - uses: ./.github/actions/e2e-ui
        with:
          shard: ${{ matrix.shard }}
          shards: 2
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore
  cypress-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    name: Cypress binary cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-app
      - uses: ./.github/actions/cypress-binary
        with:
          save: 'true'
  changeset-validation:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: Changeset validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
      - name: Run changeset version
        # @changesets/cli v3 exits 1 when there are no unreleased changesets;
        # a PR without one (docs/tests/lint-only) is valid, so skip cleanly
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            pnpm ci:version:changeset
          else
            echo "no changesets present — nothing to validate"
          fi
  sync-translations:
    needs: [build]
    runs-on: ubuntu-latest
    name: synchronize translations
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'verdaccio/verdaccio') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: ./.github/actions/install-app
        with:
          ignore-scripts: 'false'
      - name: build
        run: pnpm build
      - name: sync
        env:
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: pnpm crowdin:sync
  cleanup:
    needs: [test, e2e-cli, e2e-ui]
    if: always()
    runs-on: ubuntu-latest
    name: Cleanup caches
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/delete-build-cache
        with:
          node-versions: 24 26
          token: ${{ github.token }}
