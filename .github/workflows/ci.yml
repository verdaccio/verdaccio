name: CI

on:
  # Branch pushes only: a PR branch push would otherwise run CI twice
  push:
    branches: ['6.x']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-6.x
  cancel-in-progress: true

jobs:
  changeset-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.head_ref != 'changeset-release/6.x' &&
      !contains(github.event.pull_request.labels.*.name, 'skip changeset')
    runs-on: ubuntu-latest
    name: Changeset file check
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check changeset
        uses: ./.github/actions/changeset-check
  lint:
    runs-on: ubuntu-latest
    name: Lint and format
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-app
      - name: Lint
        run: yarn lint
      - name: Format check
        run: yarn format:check
  # Pushes to 6.x only run lint and format; everything else runs on PRs
  build:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-app
        with:
          node-version: ${{ matrix.node_version }}
      - name: Build
        run: yarn build
      - name: Types
        run: yarn code:types
      - name: Test
        run: yarn test
      # The e2e jobs restore this build instead of building again
      - name: Save build
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/
          key: ci-build-${{ github.run_id }}-${{ github.run_attempt }}-node-${{ matrix.node_version }}
  changeset-validation:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.head_ref != 'changeset-release/6.x'
    runs-on: ubuntu-latest
    name: Changeset validation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-app
      - name: Run changeset version
        # @changesets/cli v3 exits 1 when there are no changesets; a PR without one is valid
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            yarn ci:version:changeset
          else
            echo "no changesets present, nothing to validate"
          fi
  e2e-cli:
    needs: [build]
    if: github.event_name == 'pull_request'
    name: E2E CLI (${{ matrix.pm }}, Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
        pm: [npm@10, npm@11, npm@12, pnpm@11, pnpm@10, yarn-modern@4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-app
        with:
          node-version: ${{ matrix.node_version }}
      - name: Restore build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/
          key: ci-build-${{ github.run_id }}-${{ github.run_attempt }}-node-${{ matrix.node_version }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/start-verdaccio
      - name: Run E2E CLI tests
        run: yarn verdaccio-e2e --registry http://localhost:4873 --pm ${{ matrix.pm }} --uplink-port 4874 -v
        env:
          E2E_PENDING_CONTRACT_CHECKS: tarballs
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"
  e2e-ui:
    needs: [build]
    if: github.event_name == 'pull_request'
    name: E2E UI (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-app
        with:
          node-version: 24
      - name: Restore build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build/
          key: ci-build-${{ github.run_id }}-${{ github.run_attempt }}-node-24
          fail-on-cache-miss: true
      - name: Install Cypress binary
        run: yarn cypress install
      - uses: ./.github/actions/start-verdaccio
        with:
          config: ./scripts/e2e-ui-config.yaml
          test-user: 'true'
      - name: Run Cypress
        run: yarn cypress run
        env:
          VERDACCIO_URL: http://localhost:4873
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"
  cleanup:
    needs: [build, e2e-cli, e2e-ui]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Cleanup caches
    permissions:
      actions: write
    steps:
      - name: Delete build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for node in 22 24 26; do
            gh cache delete "ci-build-${{ github.run_id }}-${{ github.run_attempt }}-node-$node" --repo ${{ github.repository }} || true
          done
