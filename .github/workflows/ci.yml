name: CI

on:
  push:
    branches:
      - '8.x'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .changeset/**
      - .github/workflows/ci.yml
      - 'packages/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.head_ref != 'changeset-release/8.x'
    runs-on: ubuntu-latest
    name: Changeset file check
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check changeset
        uses: verdaccio/verdaccio/.github/actions/changeset-check@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint & Format
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          reporter: 'default'
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
  build:
    if: ${{ github.event.pull_request.draft == false }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node_version: [22, 24, 26]
    name: Build / ${{ matrix.os }} / Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Build
        run: pnpm build
      - uses: verdaccio/verdaccio/.github/actions/build-cache@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          mode: save
          node-version: ${{ matrix.node_version }}
  test:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node_version: [22, 24, 26]
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          node-version: ${{ matrix.node_version }}
      - uses: verdaccio/verdaccio/.github/actions/build-cache@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          mode: restore
          node-version: ${{ matrix.node_version }}
      - name: Test (Node 26)
        if: matrix.node_version == 26
        run: pnpm test
        env:
          NODE_OPTIONS: --no-webstorage
      - name: Test (Other Node)
        if: matrix.node_version != 26
        run: pnpm test
  e2e:
    needs: [changeset-check, lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: E2E / Node ${{ matrix.node_version }}
    strategy:
      fail-fast: true
      matrix:
        node_version: [22, 24, 26]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          node-version: ${{ matrix.node_version }}
      - uses: verdaccio/verdaccio/.github/actions/build-cache@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          mode: restore
          node-version: ${{ matrix.node_version }}
      - name: E2E Tests
        run: pnpm test:e2e
  changeset-validation:
    needs: [test]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: Changeset validation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
      - name: Run changeset version
        run: |
          changeset_file=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)
          if [ -n "$changeset_file" ]; then
            pnpm ci:version:changeset
          else
            echo "No changesets to version."
          fi
  cleanup:
    needs: [test, e2e, changeset-validation]
    if: always()
    runs-on: ubuntu-latest
    name: Cleanup caches
    permissions:
      actions: write
    steps:
      - uses: verdaccio/verdaccio/.github/actions/delete-build-cache@efba55c9e1e7781567cd6bd96ffad0dd0c4aa1be # master
        with:
          node-versions: 22 24 26
          token: ${{ github.token }}
