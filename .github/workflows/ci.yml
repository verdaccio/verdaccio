name: CI

on:
  push:
    branches:
      - '7.x'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/ci.yml
      - 'src/**'
      - 'test/**'
      - 'docker-examples/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}-7x
  cancel-in-progress: true

jobs:
  lint-and-format:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Lint & Format
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check

  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node_version: [24, 26]
    name: Build / ${{ matrix.os }} / Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          node-version: ${{ matrix.node_version }}
          ignore-scripts: 'false'
      - name: Build
        run: pnpm build
      - uses: verdaccio/verdaccio/.github/actions/build-cache@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          mode: save
          node-version: ${{ matrix.node_version }}
          path: build/

  test:
    needs: [lint-and-format, build]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node_version: [24, 26]
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node_version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          node-version: ${{ matrix.node_version }}
          ignore-scripts: 'false'
      - uses: verdaccio/verdaccio/.github/actions/build-cache@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          mode: restore
          node-version: ${{ matrix.node_version }}
          path: build/
      - name: Test
        run: pnpm test
        env:
          NODE_OPTIONS: ${{ matrix.node_version == 26 && '--no-webstorage' || '' }}

  test-docker:
    needs: [lint-and-format, build]
    if: github.event_name == 'pull_request'
    uses: verdaccio/verdaccio/.github/workflows/test-docker.yml@8f877d52abb8f37f3b4eacd7917dad8299544034 # master

  e2e-cli:
    needs: [lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: E2E CLI (${{ matrix.pm }})
    strategy:
      fail-fast: false
      matrix:
        pm:
          - npm@10
          - npm@11
          - npm@12
          - yarn-modern@3
          - yarn-modern@4
          - pnpm@10
          - pnpm@11
          - pnpm@12
          - bun
          - deno
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - uses: verdaccio/verdaccio/.github/actions/build-cache@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          mode: restore
          node-version: 24
          path: build/
      - uses: verdaccio/verdaccio/.github/actions/start-verdaccio@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          bin: bin/verdaccio
      - uses: verdaccio/verdaccio/.github/actions/e2e-cli@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          pm: ${{ matrix.pm }}
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"

  e2e-cli-legacy-plugins:
    needs: [lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: E2E CLI (legacy plugins, ${{ matrix.pm }})
    strategy:
      fail-fast: false
      matrix:
        pm:
          - npm@12
          - pnpm@12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - uses: verdaccio/verdaccio/.github/actions/build-cache@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          mode: restore
          node-version: 24
          path: build/
      # test/e2e-plugins holds a callback-based storage plugin and a middleware plugin,
      # the only CI path through src/lib/legacy-storage-adapter.ts.
      - uses: verdaccio/verdaccio/.github/actions/start-verdaccio@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          bin: bin/verdaccio
          config: ./scripts/e2e-legacy-plugins-config.yaml
      - name: Check the adapter actually wrapped the plugin
        run: grep -q "legacy callback-based storage plugin" /tmp/verdaccio-e2e/verdaccio.log
      - uses: verdaccio/verdaccio/.github/actions/e2e-cli@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          pm: ${{ matrix.pm }}
          uplink-port: ''
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"

  e2e-ui:
    needs: [lint-and-format, build]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: E2E UI
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - uses: verdaccio/verdaccio/.github/actions/build-cache@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          mode: restore
          node-version: 24
          path: build/
      - uses: verdaccio/verdaccio/.github/actions/cypress-binary@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
      - uses: verdaccio/verdaccio/.github/actions/start-verdaccio@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          bin: bin/verdaccio
          config: ./scripts/e2e-ui-config.yaml
          test-user: 'true'
      - uses: verdaccio/verdaccio/.github/actions/e2e-ui@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          shard: 1
          shards: 1
      - name: Show Verdaccio logs
        if: always()
        run: cat /tmp/verdaccio-e2e/verdaccio.log 2>/dev/null || echo "No log file found"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  cypress-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/7.x'
    runs-on: ubuntu-latest
    name: Cypress binary cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'
      - uses: verdaccio/verdaccio/.github/actions/cypress-binary@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          save: 'true'

  codeql:
    needs: [test, e2e-cli, e2e-cli-legacy-plugins, e2e-ui]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    name: CodeQL Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5

  cleanup:
    needs: [test, e2e-cli, e2e-cli-legacy-plugins, e2e-ui, codeql]
    if: always()
    runs-on: ubuntu-latest
    name: Cleanup caches
    permissions:
      actions: write
    steps:
      - uses: verdaccio/verdaccio/.github/actions/delete-build-cache@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          node-versions: 24 26
          token: ${{ github.token }}
