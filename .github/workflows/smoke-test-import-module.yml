name: Import Module Smoke Test

on: [pull_request]  

permissions:
  contents: read
concurrency:
  group: smoke-test-import-module-${{ github.ref }}-6x
  cancel-in-progress: true    
jobs:
  test:    
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24, 26]
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0    
      - name: Use Node ${{ matrix.node_version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node_version }}
      - name: Docker test
        run: |
            docker run -d -it --rm --name verdaccio -p 4873:4873 -e "DEBUG=verdaccio*" verdaccio/verdaccio:6
      - name: wait for verdaccio
        run: |
          for i in $(seq 1 30); do
            if npx --yes @verdaccio/registry-cli ping -r http://localhost:4873 >/dev/null 2>&1; then
              echo "verdaccio is up"; exit 0
            fi
            sleep 1
          done
          echo "verdaccio did not become ready"
          docker logs verdaccio || true
          exit 1
      - name: login
        run: |
          set -euo pipefail
          token=""
          response=""
          for i in $(seq 1 10); do
            if response=$(curl -fsS -X PUT \
              -H "Content-Type: application/json" \
              -d '{"name":"test","password":"1234","email":"test@domain.test"}' \
              http://localhost:4873/-/user/org.couchdb.user:test); then
              token=$(printf '%s' "$response" | jq -r .token)
              if [ -n "$token" ] && [ "$token" != "null" ]; then
                break
              fi
            fi
            echo "login attempt $i failed, retrying..."
            sleep 2
          done
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "no token in response: $response"
            docker logs verdaccio || true
            exit 1
          fi
          echo "//localhost:4873/:_authToken=$token" >> ~/.npmrc
      - name: Install dependencies
        run: yarn
      - name: Bump up package and save version
        run: |
          npm version prerelease --no-git-tag-version --preid $(date +%s%N)
          echo "VERDACCIO_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Build
        run: yarn build
      - name: publish verdaccio 
        run: npm publish --tag next --registry http://localhost:4873
      - name: 'ESM / CJS / legacy import smoke tests'
        run: |
          source scripts/e2e-setup-ci.sh
          VERDACCIO_VERSION=${{ env.VERDACCIO_VERSION }} REGISTRY=http://localhost:4873 "$GITHUB_WORKSPACE/scripts/smoke-test/run.sh"

