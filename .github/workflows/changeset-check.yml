name: Changeset check

on:
  # Separate from CI so adding or removing a label does not rerun the whole pipeline
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
concurrency:
  group: changeset-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.head_ref != 'changeset-release/6.x' &&
      !contains(github.event.pull_request.labels.*.name, 'skip changeset')
    runs-on: ubuntu-latest
    name: Changeset file check
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check changeset
        uses: ./.github/actions/changeset-check
