name: update verdaccio 7.x dependencies 

# Manually triggered: bumps verdaccio packages (@verdaccio/*, verdaccio,
# verdaccio-*) to the versions published under a given npm dist-tag — the same
# versions a Changesets release PR carries — and opens a PR against 7.x.
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to bump verdaccio packages to'
        required: true
        default: 'next-9'
      allow_major:
        description: 'Accept a bump whose master changelogs carry breaking changes'
        type: boolean
        default: false
  # Only run on pushes to 7.x. This also avoids re-triggering on the workflow's
  # own PR branch (chore/update-verdaccio-dependencies), preventing a self-loop.
  push:
    branches:
      - 7.x

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.repository == 'verdaccio/verdaccio'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 7.x
          fetch-depth: 0

      - name: Install dependencies
        uses: verdaccio/verdaccio/.github/actions/install-app@8f877d52abb8f37f3b4eacd7917dad8299544034 # master
        with:
          ignore-scripts: 'false'

      - name: Update verdaccio packages to the dist-tag
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'next-9' }}
        # e2e-cli/e2e-ui are excluded from the dist-tag bump (they release
        # under `latest` from the e2e-tests repo, not under $DIST_TAG) and
        # updated to their own latest in the step below.
        run: |
          pnpm update -r \
            "@verdaccio/*@$DIST_TAG" "verdaccio@$DIST_TAG" "verdaccio-*@$DIST_TAG" \
            "!@verdaccio/e2e-cli" "!@verdaccio/e2e-ui"

      - name: Update e2e tooling to latest
        # The e2e battery packages version independently of the release line;
        # updating a package that is not a dependency is a silent no-op.
        run: |
          pnpm update -r "@verdaccio/e2e-cli@latest" "@verdaccio/e2e-ui@latest"

      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet -- '*.json' pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.diff.outputs.changed == 'true'
        run: pnpm build

      - name: Write the changeset from the master changelogs
        if: steps.diff.outputs.changed == 'true'
        id: changeset
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'next-9' }}
          ALLOW_MAJOR: ${{ github.event.inputs.allow_major == 'true' && '--allow-major' || '' }}
        # The bumped @verdaccio/* packages are developed on master; their
        # CHANGELOG.md entries between the old and new versions become the
        # changeset body and decide the bump (minor when any package gained a feature).
        run: |
          git fetch --no-tags origin master
          CHANGESET=".changeset/update-verdaccio-dependencies-${GITHUB_RUN_ID}.md"
          BUMP=$(node scripts/dependency-update-changeset.mjs \
            --master origin/master --dist-tag "$DIST_TAG" --out "$CHANGESET" $ALLOW_MAJOR)
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          cat "$CHANGESET"

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ github.event.inputs.dist_tag || 'next-9' }}
          BUMP: ${{ steps.changeset.outputs.bump }}
        run: |
          # Stable branch: the working tree is already rebased on the latest
          # 7.x (checked out above), so force-pushing it rebases any existing PR.
          BRANCH="chore/update-verdaccio-dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          # Format updated package.json files before committing.
          pnpm format

          # The squash commit takes the PR title: a bump that brings features is a feat.
          if [ "$BUMP" = "patch" ]; then
            TITLE="chore: update verdaccio 7.x dependencies"
          else
            TITLE="feat: update verdaccio 7.x dependencies"
          fi
          git add -A
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          BODY="Automated update of verdaccio packages only — \`@verdaccio/*\`, \`verdaccio\`, and \`verdaccio-*\` — to the \`$DIST_TAG\` npm dist-tag. The changeset is built from the master changelogs of the bumped packages (\`$BUMP\` bump). Triggered via the **update verdaccio 7.x dependencies** workflow.

          $(git diff --stat HEAD~1)"

          PR=$(gh pr list --head "$BRANCH" --base 7.x --state open --json number --jq '.[].number')
          if [ -n "$PR" ]; then
            echo "Existing PR #$PR found — branch force-pushed (rebased onto latest 7.x)."
            gh pr edit "$PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base 7.x --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
