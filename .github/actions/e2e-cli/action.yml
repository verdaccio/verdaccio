name: 'E2E CLI'
description: 'Run the @verdaccio/e2e-cli battery for one package manager against localhost:4873'

inputs:
  pm:
    description: 'Package manager spec, e.g. npm@11, pnpm@10, bun, deno'
    required: true
  uplink-port:
    description: 'Mock uplink port; empty skips the uplink scenarios'
    required: false
    default: '4874'
  pending-checks:
    description: 'E2E_PENDING_CONTRACT_CHECKS'
    required: false
    default: 'tarballs'

runs:
  using: composite
  steps:
    - name: Setup Bun
      if: startsWith(inputs.pm, 'bun')
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
    - name: Setup Deno
      if: startsWith(inputs.pm, 'deno')
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
    - name: Run E2E CLI tests
      shell: bash
      env:
        E2E_PENDING_CONTRACT_CHECKS: ${{ inputs.pending-checks }}
      run: pnpm verdaccio-e2e --registry http://localhost:4873 --pm ${{ inputs.pm }} ${{ inputs.uplink-port != '' && format('--uplink-port {0}', inputs.uplink-port) || '' }} -v
