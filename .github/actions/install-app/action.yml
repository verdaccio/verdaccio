name: 'Install app'
description: 'Set up Node.js and install dependencies with yarn'

inputs:
  node-version:
    description: 'Node.js version to use. When empty, falls back to .nvmrc.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # package-manager-cache off: setup-node otherwise stores a ~65MB yarn cache per PR
    - name: Use Node (explicit version)
      if: inputs.node-version != ''
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Use Node (from .nvmrc)
      if: inputs.node-version == ''
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version-file: '.nvmrc'
        package-manager-cache: false
    - name: Enable corepack
      shell: bash
      run: corepack enable
    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
