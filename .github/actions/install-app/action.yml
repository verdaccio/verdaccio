name: 'Install app'
description: 'install application'

inputs:
  registry-url:
    description: 'Registry URL for pnpm'
    required: false
    default: 'https://registry.npmjs.org'
  reporter:
    description: 'Reporter for pnpm'
    required: false
    default: 'silent'
  loglevel:
    description: 'Log level for pnpm'
    required: false
    default: 'error'
  node-version:
    description: 'Node.js version to use. When empty, falls back to .nvmrc.'
    required: false
    default: ''
  ignore-scripts:
    description: 'Skip lifecycle scripts during install'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      run: |
        npm install --global corepack@latest
        corepack enable
        corepack prepare
      shell: bash
    - name: Use Node (explicit version)
      if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Use Node (from .nvmrc)
      if: inputs.node-version == ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
    - name: Install
      run: pnpm install --reporter=${{ inputs.reporter }} ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }} --registry ${{ inputs.registry-url }} --loglevel=${{ inputs.loglevel }}
      shell: bash
