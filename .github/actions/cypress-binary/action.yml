name: 'Cypress binary'
description: 'Restore the Cypress binary keyed on its version, installing it on a miss; save only from branch pushes'

inputs:
  save:
    description: 'Save the binary on a cache miss (branch pushes only, so PRs do not fill the cache quota)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cypress version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./package.json').devDependencies.cypress")" >> "$GITHUB_OUTPUT"
    - name: Restore Cypress binary
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ steps.version.outputs.version }}
        lookup-only: ${{ inputs.save == 'true' }}
    - name: Install Cypress binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec cypress install
    - name: Save Cypress binary
      if: inputs.save == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ steps.version.outputs.version }}
